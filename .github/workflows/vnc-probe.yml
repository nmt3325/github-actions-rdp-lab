name: Probe VNC authentication
on:
  workflow_dispatch:
    inputs:
      target:
        description: Current macOS Tailscale IPv4 or MagicDNS
        required: true
        type: string
        default: rdp-macos-00
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
      VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
      VNC_HOST: ${{ inputs.target }}
    steps:
      - name: Connect to Tailnet
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          hostname: vnc-probe-${{ github.run_id }}
      - name: Install DES test library
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/vnc-venv"
          "$RUNNER_TEMP/vnc-venv/bin/pip" --disable-pip-version-check -q install pycryptodome==3.23.0
      - name: Verify legacy VNC authentication and framebuffer init
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/vnc-venv/bin/python" - <<'PY'
          import os, socket, struct
          from Crypto.Cipher import DES

          host = os.environ['VNC_HOST']
          raw = os.environ.get('VNC_PASSWORD') or os.environ['RDP_PASSWORD'][:8]
          if len(raw) != 8 or any(not (33 <= ord(ch) <= 126) for ch in raw):
              raise SystemExit('VNC password is not eight printable ASCII characters')

          def readn(sock, n):
              data = b''
              while len(data) < n:
                  chunk = sock.recv(n-len(data))
                  if not chunk:
                      raise EOFError('VNC socket closed unexpectedly')
                  data += chunk
              return data

          with socket.create_connection((host,5900),timeout=12) as sock:
              sock.settimeout(15)
              banner = readn(sock,12)
              print('Server RFB protocol:',banner.decode('ascii','replace').strip())
              assert banner.startswith(b'RFB 003.'), 'Not an RFB/VNC server'
              sock.sendall(b'RFB 003.008\n')
              n = readn(sock,1)[0]
              types = readn(sock,n)
              print('Supported RFB security types:',list(types))
              assert 2 in types, 'Legacy VNC authentication (type 2) not offered'
              sock.sendall(b'\x02')
              challenge = readn(sock,16)
              key = bytes(int(f'{b:08b}'[::-1], 2) for b in raw.encode('ascii'))
              response = DES.new(key,DES.MODE_ECB).encrypt(challenge)
              sock.sendall(response)
              result = struct.unpack('>I',readn(sock,4))[0]
              assert result == 0, f'VNC password authentication rejected (code {result})'
              print('VNC password authentication succeeded')
              sock.sendall(b'\x01')
              width,height = struct.unpack('>HH',readn(sock,4))
              pixfmt = readn(sock,16)
              name_len = struct.unpack('>I',readn(sock,4))[0]
              name = readn(sock,min(name_len,4096))
              print(f'VNC framebuffer initialized: {width}x{height}; desktop name: {name.decode("utf-8","replace")[:100]}')
              # Request a small raw rectangle and confirm pixels arrive.
              sock.sendall(b'\x02\x00\x00\x01\x00\x00\x00\x00')  # SetEncodings: raw
              sock.sendall(b'\x03\x00'+struct.pack('>HHHH',0,0,32,32))
              t = readn(sock,1)[0]
              assert t == 0, f'Expected FramebufferUpdate (0), got {t}'
              _,nrect = struct.unpack('>BH',readn(sock,3))
              assert nrect > 0, 'No updated rectangles'
              rx,ry,rw,rh,encoding=struct.unpack('>HHHHi',readn(sock,12))
              assert encoding == 0, f'Expected raw pixel rectangle; got {encoding}'
              size = rw*rh*(pixfmt[0]//8)
              assert 0 < size <= 1048576, f'Unexpected rectangle size {size}'
              pixels = readn(sock,size)
              print(f'VNC screen pixel delivery succeeded: {rw}x{rh}, {len(pixels)} bytes, unique byte values={len(set(pixels))}')
              # Sample center and other locations to distinguish a blank display
              # from a black pixel at the top-left corner.
              for xpos,ypos in ((width//2,height//2),(width//4,height//2),(3*width//4,height//2)):
                  xpos=min(xpos,width-128)
                  ypos=min(ypos,height-128)
                  sock.sendall(b'\x03\x00'+struct.pack('>HHHH',xpos,ypos,128,128))
                  mt=readn(sock,1)[0]
                  assert mt == 0, f'Expected frame update, got {mt}'
                  _,nr=struct.unpack('>BH',readn(sock,3))
                  assert nr>0
                  buf=b''
                  for _ in range(nr):
                      rx,ry,rw,rh,encoding=struct.unpack('>HHHHi',readn(sock,12))
                      assert encoding == 0, f'Unexpected rectangle encoding {encoding}'
                      size=rw*rh*(pixfmt[0]//8)
                      assert 0<size<=4*1024*1024
                      buf+=readn(sock,size)
                  print(f'VNC sampled at ({xpos},{ypos}): distinct byte values={len(set(buf))}, bytes={len(buf)}')


          PY
